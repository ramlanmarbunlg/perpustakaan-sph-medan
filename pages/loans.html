<div id="loansPage">

  <!-- ===== TABS ===== -->
  <ul class="nav nav-tabs mb-3" id="loansTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="tabNewLoan" data-bs-toggle="tab"
              data-bs-target="#paneNewLoan" type="button" role="tab">
        <i class="bi bi-plus-circle me-1"></i>Transaksi Baru
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tabActiveLoans" data-bs-toggle="tab"
              data-bs-target="#paneActiveLoans" type="button" role="tab">
        <i class="bi bi-journal-text me-1"></i>Daftar Peminjaman
        <span class="badge bg-secondary ms-1" id="tabActiveLoansCount">0</span>
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ============================================================
         TAB 1: TRANSAKSI BARU
         ============================================================ -->
    <div class="tab-pane fade show active" id="paneNewLoan" role="tabpanel">
      <div class="row g-3">

        <!-- ==== KIRI: PEMINJAM ==== -->
        <div class="col-lg-5">
          <div class="page-card h-100">
            <div class="page-card-header">
              <h5 class="page-card-title">
                <i class="bi bi-person-check me-2"></i>1. Pilih Peminjam
              </h5>
            </div>
            <div class="page-card-body">

              <!-- Toggle borrower type -->
              <div class="btn-group w-100 mb-3" role="group">
                <input type="radio" class="btn-check" name="borrowerType"
                       id="btStudent" value="STUDENT" checked>
                <label class="btn btn-outline-primary btn-sm" for="btStudent">
                  <i class="bi bi-people me-1"></i>Siswa
                </label>
                <input type="radio" class="btn-check" name="borrowerType"
                       id="btStaff" value="STAFF">
                <label class="btn btn-outline-primary btn-sm" for="btStaff">
                  <i class="bi bi-person-badge me-1"></i>Guru/Staf
                </label>
              </div>

              <!-- Search -->
              <div class="position-relative">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="borrowerSearchInput"
                         placeholder="Cari nama atau NIS/NIP..." autocomplete="off">
                </div>
                <div id="borrowerSearchResults" class="search-dropdown d-none"></div>
              </div>

              <!-- Borrower card -->
              <div id="borrowerCard" class="d-none mt-3"></div>

            </div>
          </div>
        </div>

        <!-- ==== KANAN: KERANJANG BUKU ==== -->
        <div class="col-lg-7">
          <div class="page-card h-100">
            <div class="page-card-header">
              <h5 class="page-card-title">
                <i class="bi bi-cart-plus me-2"></i>2. Pilih Buku
              </h5>
              <small class="text-muted" id="cartCounter">0 eksemplar</small>
            </div>
            <div class="page-card-body">

              <!-- Search buku -->
              <div class="position-relative mb-3">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-white"><i class="bi bi-book"></i></span>
                  <input type="text" class="form-control" id="bookSearchInput"
                         placeholder="Cari judul atau ISBN..." autocomplete="off">
                </div>
                <div id="bookSearchResults" class="search-dropdown d-none"></div>
              </div>

              <!-- Cart -->
              <div id="cartList" class="cart-list">
                <div class="empty-cart">
                  <i class="bi bi-inbox"></i>
                  <div class="small text-muted">Belum ada buku dipilih</div>
                </div>
              </div>

            </div>
            <div class="page-card-header border-top">
              <div class="d-flex justify-content-between align-items-center w-100">
                <div>
                  <small class="text-muted">Jatuh tempo:</small>
                  <strong id="dueDatePreview" class="ms-1">-</strong>
                </div>
                <button class="btn btn-primary" id="btnSubmitLoan" disabled>
                  <i class="bi bi-check-lg me-1"></i>Proses Peminjaman
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================
         TAB 2: DAFTAR PEMINJAMAN AKTIF
         ============================================================ -->
    <div class="tab-pane fade" id="paneActiveLoans" role="tabpanel">

      <div class="page-card mb-3">
        <div class="page-card-body">
          <div class="row g-2 align-items-center">
            <div class="col-md-5">
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="loansSearchInput"
                       placeholder="Cari nomor transaksi atau nama peminjam...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select form-select-sm" id="loansStatusFilter">
                <option value="">Semua Status</option>
                <option value="ACTIVE" selected>Aktif</option>
                <option value="PARTIALLY_RETURNED">Kembali Sebagian</option>
                <option value="COMPLETED">Selesai</option>
                <option value="CANCELLED">Dibatalkan</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select form-select-sm" id="loansBorrowerFilter">
                <option value="">Semua</option>
                <option value="STUDENT">Siswa</option>
                <option value="STAFF">Guru/Staf</option>
              </select>
            </div>
            <div class="col-md-2 text-end">
              <button class="btn btn-sm btn-outline-secondary w-100" id="btnRefreshLoans">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="page-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>No. Transaksi</th>
                <th>Peminjam</th>
                <th>Tgl Pinjam</th>
                <th class="text-center">Buku</th>
                <th>Status</th>
                <th width="150" class="text-end">Aksi</th>
              </tr>
            </thead>
            <tbody id="loansTableBody">
              <tr><td colspan="6" class="empty-row">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="page-card-header border-top">
          <div class="d-flex justify-content-between align-items-center w-100">
            <small class="text-muted" id="loansInfo"></small>
            <nav><ul class="pagination pagination-sm mb-0" id="loansPagination"></ul></nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     MODAL: DETAIL TRANSAKSI
     ============================================================ -->
<div class="modal fade" id="loanDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loanDetailTitle">Detail Transaksi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="loanDetailBody">
        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        <button type="button" class="btn btn-warning" id="btnCancelLoan">
          <i class="bi bi-x-circle me-1"></i>Batalkan Transaksi
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     MODAL: STRUK / SUKSES PEMINJAMAN
     ============================================================ -->
<div class="modal fade" id="loanSuccessModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="success-icon-large">
          <i class="bi bi-check-lg"></i>
        </div>
        <h5 class="mt-3 mb-1">Peminjaman Berhasil!</h5>
        <div class="text-muted small mb-3">Transaksi telah dicatat</div>

        <div class="struk-box">
          <div class="struk-row">
            <span>No. Transaksi</span>
            <strong id="strukLoanNumber">-</strong>
          </div>
          <div class="struk-row">
            <span>Peminjam</span>
            <strong id="strukBorrower">-</strong>
          </div>
          <div class="struk-row">
            <span>Jumlah Buku</span>
            <strong id="strukBookCount">-</strong>
          </div>
          <div class="struk-row">
            <span>Jatuh Tempo</span>
            <strong id="strukDueDate">-</strong>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary w-100" id="btnCloseStruk">
          <i class="bi bi-check2-circle me-1"></i>Selesai
        </button>
      </div>
    </div>
  </div>
</div>
